# Values are generated once and retained in the operating-system keyring.
# Keep these entries with the database: replacing the encryption key loses
# access to previously stored integration tokens.
[project]
name = "openswe-data"
revision = "1.0"

[profiles.default]
TOKEN_ENCRYPTION_KEY = { description = "Encrypt stored Open SWE integration tokens", type = "base64", generate = { bytes = 32 } }
DASHBOARD_JWT_SECRET = { description = "Sign Open SWE dashboard sessions", type = "hex", generate = { bytes = 32 } }
